name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate JSON
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/power_topology/manifest.json >/dev/null
          python -m json.tool custom_components/power_topology/translations/en.json >/dev/null

      - name: Compile Python
        run: python -m compileall -q custom_components tests

      - name: Run evidence tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master
